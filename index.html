<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Monthsary</title>
    <meta
      name="description"
      content="A romantic monthsary message page inspired by a TikTok-style love card."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-image" aria-hidden="true"></div>

    <div class="sparkles" aria-hidden="true">
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
    </div>

    <main class="page-shell">
      <button class="letter-envelope" type="button" aria-label="Open love letter">
        <span class="envelope-top"></span>
        <span class="envelope-front"></span>
        <span class="envelope-label">Open Letter</span>
      </button>

      <section class="proposal-card" aria-label="Monthsary celebration card">
        <div class="card-tag">TO MY LOVE</div>

        <div class="heart-badge" aria-label="love symbol">❤</div>

        <h1 class="hero-title">Happy Monthsary</h1>

        <h2 class="proposal-text">
          Every month with you feels like a beautiful dream,<br />
          and every day with you makes my heart feel more at home.
        </h2>

        <button class="yes-btn" type="button">I Love You</button>

        <p class="subtext">Thank you for being my favorite person, my safe place, and my sweetest forever.</p>
      </section>

      <div class="gallery-modal" aria-hidden="true">
        <div class="gallery-backdrop" data-close="true"></div>

        <div class="gallery-dialog" role="dialog" aria-modal="true" aria-labelledby="galleryTitle">
          <button class="gallery-close" type="button" aria-label="Close gallery">×</button>

          <div class="gallery-header">
            <span class="gallery-tag">Our Story</span>
            <h3 id="galleryTitle">Forever in Pictures</h3>
          </div>

          <div class="gallery-grid">
            <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80" alt="Couple together" />
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80" alt="Happy together" />
            <img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=900&q=80" alt="Date time" />
            <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=900&q=80" alt="Sunset together" />
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80" alt="Smile and love" />
            <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=900&q=80" alt="Loving moments" />
          </div>
        </div>
      </div>
    </main>

    <div class="lightbox" aria-hidden="true">
      <button class="lightbox-close" type="button" aria-label="Close image">×</button>
      <img class="lightbox-image" src="" alt="Expanded memory" />
      <p class="lightbox-caption"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
