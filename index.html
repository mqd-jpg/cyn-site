    <title>Happy Monthsary</title>
    <meta
      name="description"
      content="A romantic monthsary message page inspired by a TikTok-style love card."
    />

  <body>
    <div class="bg-image" aria-hidden="true"></div>

    <div class="sparkles" aria-hidden="true">
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
    </div>

    <main class="page-shell">
      <button class="letter-envelope" type="button" aria-label="Open love letter">
        <span class="envelope-top"></span>
        <span class="envelope-front"></span>
        <span class="envelope-label">Open Letter</span>
      </button>

      <section class="proposal-card" aria-label="Monthsary celebration card">
        <div class="card-tag">TO MY LOVE</div>

        <div class="heart-badge" aria-label="love symbol">❤</div>

        <h1 class="hero-title">Happy Monthsary Cyn!!</h1>

        <h2 class="proposal-text">
          Another month with you, Another AWAY with you<br />
          and I'm still grateful that i get to call you mine.
        </h2>

        <button class="yes-btn" type="button">I Love You</button>

        <p class="subtext">Thank you for being my favorite person, my safe place, and my sweetest forever.</p>
      </section>
