<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#8bdcff">
<title>Flappy Sky — Flappy Bird Style Game YEYY</title>
<style>
:root{--ink:#29445d;--cream:#fff8dc}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(#9be5ff,#e8fbff);color:var(--ink)}
body{display:flex;justify-content:center;align-items:center;padding:14px}
.shell{width:min(100%,850px)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 10px}
h1{font-size:clamp(22px,4vw,32px);margin:0;text-shadow:2px 2px white}
.sub{font-size:12px;font-weight:700;color:#52748b}
.pill{background:#fffdf2;border:2px solid var(--ink);border-radius:12px;padding:7px 12px;font-weight:900;box-shadow:0 3px 0 var(--ink)}
.frame{position:relative;overflow:hidden;border:4px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink),0 14px 25px #4e819944;background:#91ddff}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:manipulation}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#193a5266}
.panel{width:min(92%,390px);padding:22px;background:#fff8df;border:4px solid var(--ink);border-radius:20px;text-align:center;box-shadow:0 7px 0 var(--ink)}
.panel h2{font-size:clamp(25px,5vw,36px);margin:0 0 8px;color:#e76b86}
.panel p{font-weight:700;line-height:1.45;color:#4a6072;margin:8px 0 16px}
button{border:3px solid var(--ink);border-radius:13px;background:#ffcf5b;color:#293e55;padding:11px 18px;font:900 16px inherit;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.secondary{background:white;margin-left:7px}
.help{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:13px 4px 0;font-size:13px;font-weight:700;color:#45647b}
@media(max-width:560px){body{padding:8px}header{align-items:flex-start;flex-direction:column}.frame{border-width:3px;border-radius:13px}.help{font-size:11px}}
</style>
</head>
<body>
<div class="shell">
<header>
 <div><h1>🐤 Flappy Sky</h1><div class="sub">Tap, flap, and fly through the pipes!</div></div>
 <div class="pill" id="scoreHud">⭐ Score: 0 &nbsp; | &nbsp; 🏆 Best: 0</div>
</header>
<div class="frame">
 <canvas id="game" width="800" height="600" aria-label="Flappy Sky game"></canvas>
 <div class="overlay" id="overlay">
  <div class="panel">
   <h2 id="panelTitle">Flappy Sky</h2>
   <p id="panelText">Help Pip the little bird fly between the pipes. Every pipe you pass earns a point. Don't bump into anything!</p>
   <button id="mainButton">Start Flying!</button>
   <button class="secondary" id="restartButton">Restart</button>
  </div>
 </div>
</div>
<div class="help"><span>⌨️ Press SPACE, W, or ↑ to flap</span><span>📱 Tap anywhere on the game to flap</span></div>
</div>
<script>
(()=>{
 const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
 const overlay=document.getElementById('overlay'),title=document.getElementById('panelTitle'),message=document.getElementById('panelText');
 const main=document.getElementById('mainButton'),restart=document.getElementById('restartButton'),hud=document.getElementById('scoreHud');
 const groundY=H-62, bird={x:190,y:270,vy:0,r:18,rot:0};
 let pipes=[],clouds=[],particles=[],score=0,best=0,state='ready',last=0,elapsed=0,spawnTimer=0;
 const gravity=.34,flapPower=-6.6,pipeW=82,gap=172,speed=2.7;
 try{best=Number(localStorage.getItem('flappySkyBest')||0)}catch(e){}
 function hudUpdate(){hud.textContent=`⭐ Score: ${score}   |   🏆 Best: ${best}`}
 function reset(){bird.y=270;bird.vy=0;bird.rot=0;pipes=[];particles=[];score=0;spawnTimer=0;elapsed=0;for(let i=0;i<3;i++)addPipe(470+i*290);hudUpdate()}
 function panel(t,m,b='Play again'){title.textContent=t;message.textContent=m;main.textContent=b;overlay.style.display='flex'}
 function begin(){if(state==='over'||state==='ready')reset();state='playing';overlay.style.display='none';flap()}
 function flap(){if(state==='ready'){begin();return}if(state!=='playing')return;bird.vy=flapPower;bird.rot=-.38;burst(bird.x-8,bird.y,'#fff4a8',5)}
 main.addEventListener('click',()=>{if(state==='over')begin();else begin()});
 restart.addEventListener('click',()=>{reset();state='playing';overlay.style.display='none';flap()});
 canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='ready')begin();else if(state==='playing')flap();else if(state==='over'){reset();state='playing';overlay.style.display='none';flap()}});
 window.addEventListener('keydown',e=>{if([' ','arrowup','w'].includes(e.key.toLowerCase())){e.preventDefault();if(state==='ready')begin();else if(state==='playing')flap();else if(state==='over'){reset();state='playing';overlay.style.display='none';flap()}}});
 function addPipe(x){let top=75+Math.random()*(groundY-gap-150);pipes.push({x,top,passed:false})}
 function burst(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:.5,color,size:2+Math.random()*4})}
 function hit(){if(state!=='playing')return;state='over';burst(bird.x,bird.y,'#ff8a9c',18);panel('Flap-tastic try! 💫',`You scored ${score} point${score===1?'':'s'}! ${score>best?'A new personal best!':'Try again and beat your best score.'}`,'Fly again')}
 function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
 function cloud(x,y,s){ctx.fillStyle='#ffffffdd';ctx.beginPath();ctx.arc(x,y,20*s,0,Math.PI*2);ctx.arc(x+22*s,y-9*s,27*s,0,Math.PI*2);ctx.arc(x+48*s,y,20*s,0,Math.PI*2);ctx.fill()}
 function background(t){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#75d5ff');g.addColorStop(1,'#e2faff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  cloud(60-(t*.012%950),100,.9);cloud(400-(t*.018%950),185,.7);cloud(760-(t*.01%950),80,1);
  ctx.fillStyle='#a5e7a6';for(let i=0;i<6;i++){let x=i*170-(t*.025%170);ctx.beginPath();ctx.arc(x,groundY+4,95,Math.PI,0);ctx.fill()}
  ctx.fillStyle='#fff0a9';ctx.beginPath();ctx.arc(680,105,38,0,Math.PI*2);ctx.fill();
 }
 function drawPipe(p){
  const x=p.x, bottom=p.top+gap;
  // upper pipe and lower pipe, with bright cartoon rims
  roundRect(x,0,pipeW,p.top-18,7,'#39ae62');roundRect(x-7,p.top-25,pipeW+14,25,6,'#27944f');
  roundRect(x,bottom+18,pipeW,groundY-bottom-18,7,'#39ae62');roundRect(x-7,bottom,pipeW+14,25,6,'#27944f');
  ctx.fillStyle='#83e78a';ctx.fillRect(x+12,0,10,Math.max(0,p.top-30));ctx.fillRect(x+12,bottom+30,10,Math.max(0,groundY-bottom-30));
  ctx.fillStyle='#d7ffd0';ctx.fillRect(x+5,p.top-19,pipeW-10,4);ctx.fillRect(x+5,bottom+5,pipeW-10,4);
 }
 function drawBird(t){
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);
  // tail, body, wing, beak, eye
  ctx.fillStyle='#f5a64e';ctx.beginPath();ctx.moveTo(-15,2);ctx.lineTo(-29,-7);ctx.lineTo(-25,9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffcf58';ctx.beginPath();ctx.ellipse(0,0,21,17,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d58c35';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#f5a64e';ctx.beginPath();ctx.ellipse(-6,5,10,6,Math.sin(t/100)*.35,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff8b55';ctx.beginPath();ctx.moveTo(16,-2);ctx.lineTo(31,3);ctx.lineTo(16,8);ctx.closePath();ctx.fill();
  ctx.fillStyle='white';ctx.beginPath();ctx.arc(9,-7,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#26364b';ctx.beginPath();ctx.arc(11,-7,2.8,0,Math.PI*2);ctx.fill();
  ctx.restore();
 }
 function drawGround(t){
  ctx.fillStyle='#d9ad70';ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='#65c95c';ctx.fillRect(0,groundY,W,13);
  ctx.fillStyle='#43aa4f';for(let x=-(t*.1%32);x<W;x+=32)ctx.fillRect(x,groundY+13,17,5);
  ctx.fillStyle='#f5d59a';for(let x=10;x<W;x+=55)ctx.fillRect(x,groundY+31,18,5);
 }
 function render(t){
  background(t);pipes.forEach(drawPipe);drawGround(t);drawBird(t);
  particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)});ctx.globalAlpha=1;
  if(state==='ready'){ctx.fillStyle='#fff';ctx.font='bold 20px Trebuchet MS';ctx.textAlign='center';ctx.fillText('TAP OR PRESS SPACE TO FLY!',W/2,390)}
 }
 function update(dt,t){
  if(state==='playing'){
   elapsed+=dt;spawnTimer+=dt;
   bird.vy+=gravity;bird.y+=bird.vy;bird.rot=Math.min(.9,Math.max(-.45,bird.vy*.075));
   if(spawnTimer>1.75){addPipe(W+30);spawnTimer=0}
   for(const p of pipes){
    p.x-=speed;
    if(!p.passed&&p.x+pipeW<bird.x){p.passed=true;score++;if(score>best){best=score;try{localStorage.setItem('flappySkyBest',best)}catch(e){}}hudUpdate()}
    const bx=bird.x,by=bird.y,r=bird.r;
    if(bx+r>p.x&&bx-r<p.x+pipeW&&(by-r<p.top||by+r>p.top+gap))hit();
   }
   pipes=pipes.filter(p=>p.x+pipeW>-20);
   if(bird.y-bird.r<0||bird.y+bird.r>groundY)hit();
  }
  particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.life-=dt}
 }
 function loop(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt,now);render(now);requestAnimationFrame(loop)}
 reset();state='ready';panel('Flappy Sky','Help Pip the little bird fly between the pipes. Every pipe you pass earns a point. Don’t bump into anything!','Start Flying!');requestAnimationFrame(loop);
})();
</script>
</body>
</html>
